
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Barbearia</title>
</head>
<body>

    <h1>Sistema de Barbearia</h1>

    <h2>Cadastro de Cliente</h2>

    <input type="text" id="cadNome" placeholder="Nome">
    <input type="text" id="cadCpf" placeholder="CPF">
    <input type="text" id="cadTelefone" placeholder="Telefone">
    <input type="password" id="cadSenha" placeholder="Senha">

    <button id="btnCad">Cadastrar Cliente</button>

    <hr>

    <h2>Cadastro de Barbeiro</h2>

    <input type="text" id="cadNomeBarbeiro" placeholder="Nome">
    <input type="email" id="cadEmailBarbeiro" placeholder="Email">
    <input type="password" id="cadSenhaBarbeiro" placeholder="Senha">

    <button id="btnCadBarbeiro">Cadastrar Barbeiro</button>

    <p id="mensagem"></p>

    <a href="index.html">Voltar para o login</a>

    <script src="cadastro.js"></script>

</body>
</html>
