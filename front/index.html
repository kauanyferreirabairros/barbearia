<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Barbearia</title>
</head>
<body>

    <h1>Sistema Barbearia</h1>
    <p id="mensagem" role="status"></p>

    <!-- ========== ÁREA DE VISITANTE ========== -->
    <section id="area-visitante">

        <h2>Entrar</h2>
        <form id="form-login">
            <p>
                <label for="login-email">E-mail:</label><br>
                <input type="email" id="login-email" required>
            </p>
            <p>
                <label for="login-senha">Senha:</label><br>
                <input type="password" id="login-senha" required>
            </p>
            <button type="submit">Entrar</button>
        </form>

        <hr>

        <h2>Criar conta</h2>
        <form id="form-cadastro">
            <p>
                <label for="cad-nome">Nome:</label><br>
                <input type="text" id="cad-nome" required>
            </p>
            <p>
                <label for="cad-email">E-mail:</label><br>
                <input type="email" id="cad-email" required>
            </p>
            <p>
                <label for="cad-cpf">CPF (somente números):</label><br>
                <input type="text" id="cad-cpf" maxlength="11" pattern="\d{11}" required>
            </p>
            <p>
                <label for="cad-senha">Senha:</label><br>
                <input type="password" id="cad-senha" required>
            </p>
            <button type="submit">Cadastrar</button>
        </form>

        <hr>

        <h2>Nossos serviços</h2>
        <table border="1" cellpadding="4">
            <thead>
                <tr><th>Serviço</th><th>Preço</th><th>Duração</th></tr>
            </thead>
            <tbody id="tabela-servicos"></tbody>
        </table>

        <h2>Nossos barbeiros</h2>
        <ul id="lista-barbeiros"></ul>

    </section>

    <!-- ========== ÁREA DO CLIENTE LOGADO ========== -->
    <section id="area-cliente" hidden>

        <p>Olá, <strong id="nome-cliente"></strong>! <button type="button" id="btn-sair">Sair</button></p>

        <h2>Novo agendamento</h2>
        <form id="form-agendamento">
            <p>
                <label for="ag-servico">Serviço:</label><br>
                <select id="ag-servico" required></select>
            </p>
            <p>
                <label for="ag-barbeiro">Barbeiro:</label><br>
                <select id="ag-barbeiro" required></select>
            </p>
            <p>
                <label for="ag-data">Data:</label><br>
                <input type="date" id="ag-data" required>
            </p>
            <p>
                <label for="ag-horario">Horário:</label><br>
                <input type="time" id="ag-horario" step="1800" required>
            </p>
            <button type="submit">Agendar</button>
        </form>

        <hr>

        <h2>Meus agendamentos</h2>
        <table border="1" cellpadding="4">
            <thead>
                <tr>
                    <th>Data</th><th>Horário</th><th>Serviço</th>
                    <th>Barbeiro</th><th>Preço</th><th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabela-agendamentos"></tbody>
        </table>
        <p id="sem-agendamentos" hidden>Você ainda não tem agendamentos.</p>

    </section>

    <script src="script.js"></script>
</body>
</html>
